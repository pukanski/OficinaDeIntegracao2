<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ELLP - Jogo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <p id="carregando">Carregando...</p>

  <main id="conteudo" class="pagina tela-jogo" hidden>
    <header class="topo">
      <a class="marca" href="index.html"><span class="marca-icone" aria-hidden="true">🤖</span>ELLP</a>
      <nav class="topo-nav" aria-label="Principal">
        <a href="index.html" aria-current="page">Jogo</a>
        <a href="painel.html">Desempenho</a>
      </nav>
      <div class="topo-usuario">
        <span id="nome-usuario"></span>
        <button id="btn-sair" class="btn btn-discreto" type="button">Sair</button>
      </div>
    </header>

    <nav id="lista-fases" class="lista-fases" aria-label="Fases"></nav>

    <section class="fase-cabecalho">
      <h1 id="titulo-fase"></h1>
      <p id="descricao-fase"></p>
    </section>

    <div id="grid" class="grid" data-testid="grid"></div>

    <div class="controles" aria-label="Controles de movimento">
      <button type="button" data-direcao="cima" class="btn tecla c-cima" aria-label="Cima">↑</button>
      <button type="button" data-direcao="esquerda" class="btn tecla c-esquerda" aria-label="Esquerda">←</button>
      <button type="button" data-direcao="direita" class="btn tecla c-direita" aria-label="Direita">→</button>
      <button type="button" data-direcao="baixo" class="btn tecla c-baixo" aria-label="Baixo">↓</button>
    </div>
    <p class="dica">Você também pode usar as setas do teclado.</p>

    <p id="mensagem" role="status" data-testid="mensagem"></p>

    <div class="acoes">
      <button id="btn-reiniciar" class="btn" type="button">Reiniciar</button>
      <button id="btn-proxima" class="btn btn-primario" type="button" hidden>Próxima fase</button>
    </div>
  </main>

  <script type="module" src="js/game.js"></script>
</body>
</html>
