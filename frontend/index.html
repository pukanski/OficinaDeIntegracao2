<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ELLP - Jogo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <p id="carregando">Carregando...</p>

  <main id="conteudo" class="tela-jogo" hidden>
    <header>
      <h1 id="titulo-fase"></h1>
      <span id="nome-usuario"></span>
      <a href="painel.html">Painel de desempenho</a>
      <button id="btn-sair" type="button">Sair</button>
    </header>

    <nav id="lista-fases" class="lista-fases" aria-label="Fases"></nav>
    <p id="descricao-fase"></p>

    <div id="grid" class="grid" data-testid="grid"></div>

    <div class="controles" aria-label="Controles de movimento">
      <button type="button" data-direcao="cima" class="c-cima" aria-label="Cima">↑</button>
      <button type="button" data-direcao="esquerda" class="c-esquerda" aria-label="Esquerda">←</button>
      <button type="button" data-direcao="direita" class="c-direita" aria-label="Direita">→</button>
      <button type="button" data-direcao="baixo" class="c-baixo" aria-label="Baixo">↓</button>
    </div>

    <p id="mensagem" role="status" data-testid="mensagem"></p>

    <div class="acoes">
      <button id="btn-reiniciar" type="button">Reiniciar</button>
      <button id="btn-proxima" type="button" hidden>Próxima fase</button>
    </div>
  </main>

  <script type="module" src="js/game.js"></script>
</body>
</html>
