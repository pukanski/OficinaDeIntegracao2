<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ELLP - Criar conta</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth">
  <a class="marca auth-marca" href="login.html"><span class="marca-icone" aria-hidden="true">🤖</span>ELLP</a>

  <main class="cartao-auth tela-cadastro">
    <div>
      <h1>Criar conta</h1>
      <p class="subtitulo">Crie sua conta para salvar seu progresso nas fases.</p>
    </div>

    <p id="erro" class="alerta alerta-erro" role="alert" hidden></p>

    <form id="form-cadastro" novalidate>
      <div class="campo">
        <label for="nome">Nome</label>
        <input id="nome" type="text" autocomplete="name" required>
      </div>
      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="email" required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="new-password" minlength="8" aria-describedby="ajuda-senha" required>
        <span id="ajuda-senha" class="ajuda">Use pelo menos 8 caracteres.</span>
      </div>
      <div class="campo">
        <label for="confirmar-senha">Confirmar senha</label>
        <input id="confirmar-senha" type="password" autocomplete="new-password" required>
      </div>
      <button id="btn-cadastrar" class="btn btn-primario btn-bloco" type="submit">Criar conta</button>
    </form>

    <div class="divisor" aria-hidden="true">ou</div>

    <button id="btn-google" class="btn btn-bloco" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Cadastrar com Google
    </button>

    <p class="rodape-auth">Já tem conta? <a href="login.html">Entrar</a></p>
  </main>

  <script type="module" src="js/cadastro.js"></script>
</body>
</html>
