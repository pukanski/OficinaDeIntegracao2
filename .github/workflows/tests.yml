name: Testes Automatizados

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  testes-unitarios-e-integracao:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user123
          POSTGRES_PASSWORD: "123456"
          POSTGRES_DB: ellpDbTest
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U user123"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar migrações no banco de teste
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://user123:123456@localhost:5433/ellpDbTest
        run: alembic upgrade head

      - name: Rodar testes unitários e de integração com cobertura
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://user123:123456@localhost:5433/ellpDbTest
          SECRET_KEY: chaveTeste
          ALGORITHM: HS256
        run: pytest --cov=app tests/ --cov-report=term-missing